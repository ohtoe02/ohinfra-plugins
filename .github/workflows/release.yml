name: release

on:
  push:
    tags:
      - "*-base-v*"

permissions:
  contents: write

jobs:
  server-setup-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: startsWith(github.ref_name, 'server-setup-base-v')
        with:
          go-version: "1.26.0"
          cache: true
      - name: Run release-blocking server setup readiness
        if: startsWith(github.ref_name, 'server-setup-base-v')
        shell: bash
        run: |
          go test -race -timeout=5m ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-base_linux_amd64 ./cmd/server-setup-base
          while IFS='|' read -r image expected_id expected_version; do
            docker run --rm \
              --volume "$PWD:/work:ro" \
              --env EXPECTED_ID="$expected_id" \
              --env EXPECTED_VERSION="$expected_version" \
              "$image" sh -ceu '
                . /etc/os-release
                test "$ID" = "$EXPECTED_ID"
                test "$VERSION_ID" = "$EXPECTED_VERSION"
                printf "%s\n" \
                  "{\"protocol_version\":1,\"request_id\":\"release-readiness\",\"command_path\":[\"setup\",\"check\"],\"arguments\":[],\"options\":{}}" |
                  /work/server-setup-base_linux_amd64 execute --protocol=1 >/tmp/result.json
                grep -q "\"schema_version\":\"1.0\"" /tmp/result.json
              '
          done <<'EOF'
          debian:10-slim|debian|10
          debian:11-slim|debian|11
          debian:12-slim|debian|12
          debian:13-slim|debian|13
          ubuntu:20.04|ubuntu|20.04
          ubuntu:22.04|ubuntu|22.04
          ubuntu:24.04|ubuntu|24.04
          EOF

  release:
    needs: server-setup-readiness
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ohtoe02/ohtools-plugin-catalog
          ref: 1cc324c5f62328b6edebebc6360b7d47c593ba19
          path: .catalog-contract-source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: Validate registry and vendored protocol contract
        run: |
          go run ./tools/pluginregistry validate
          go run ./tools/contractcheck --canonical .catalog-contract-source/contracts/protocol-v1
      - name: Resolve release coordinates
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          IFS=$'\t' read -r plugin version <<< "$(go run ./tools/pluginregistry resolve-tag "$tag")"
          echo "PLUGIN=$plugin" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Refuse to modify an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          error_file="${RUNNER_TEMP}/release-view.err"
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>"${error_file}"; then
            echo "release already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          if ! grep -Fq "release not found" "${error_file}" &&
            ! grep -Fq "HTTP 404" "${error_file}"; then
            cat "${error_file}" >&2
            echo "could not prove that the release is absent" >&2
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Build static binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.buildDate=${BUILD_DATE}" \
            -o "dist/${PLUGIN}_linux_amd64" "./cmd/${PLUGIN}"
          file "dist/${PLUGIN}_linux_amd64" | grep -q "statically linked"
          "dist/${PLUGIN}_linux_amd64" manifest --protocol=1 > "dist/${PLUGIN}_manifest-v1.json"
          go run ./tools/manifestcheck < "dist/${PLUGIN}_manifest-v1.json"
          go run ./tools/pluginregistry check-manifest "${PLUGIN}" "dist/${PLUGIN}_manifest-v1.json"
          sha256sum "dist/${PLUGIN}_linux_amd64" > "dist/${PLUGIN}_linux_amd64.sha256"
      - name: Generate release metadata
        shell: bash
        run: |
          go run ./tools/pluginregistry release-metadata \
            --tag "${GITHUB_REF_NAME}" \
            --binary "dist/${PLUGIN}_linux_amd64" \
            --manifest "dist/${PLUGIN}_manifest-v1.json" \
            --asset-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${PLUGIN}_linux_amd64" \
            --published-at "${BUILD_DATE}" \
            > "dist/${PLUGIN}_release-metadata-v1.json"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.44.0
      - name: Generate SPDX SBOM
        shell: bash
        run: syft "file:dist/${PLUGIN}_linux_amd64" -o "spdx-json=dist/${PLUGIN}_linux_amd64.spdx.json"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/${{ env.PLUGIN }}_linux_amd64
            dist/${{ env.PLUGIN }}_linux_amd64.sha256
            dist/${{ env.PLUGIN }}_linux_amd64.spdx.json
            dist/${{ env.PLUGIN }}_manifest-v1.json
            dist/${{ env.PLUGIN }}_release-metadata-v1.json
