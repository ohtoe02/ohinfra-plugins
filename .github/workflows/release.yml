name: release

on:
  push:
    tags:
      - "*-base-v*"

permissions:
  contents: write

jobs:
  server-setup-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: startsWith(github.ref_name, 'server-setup-base-v')
        with:
          go-version: "1.26.0"
          cache: true
      - name: Run release-blocking server setup readiness
        if: startsWith(github.ref_name, 'server-setup-base-v')
        shell: bash
        run: |
          go test -race -timeout=5m ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-base_linux_amd64 ./cmd/server-setup-base
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-readiness_linux_amd64 ./tools/server-setup-readiness
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-entitlement-fixture_linux_amd64 \
            ./tools/server-setup-entitlement-fixture
          sudo install -o root -g root -m 0755 \
            server-setup-entitlement-fixture_linux_amd64 \
            server-setup-entitlement-fixture-root_linux_amd64
          while IFS='|' read -r image expected_id expected_version; do
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
              --volume "$PWD:/work:ro" \
              --env EXPECTED_ID="$expected_id" \
              --env EXPECTED_VERSION="$expected_version" \
              "$image" sh -ceu '
                . /etc/os-release
                test "$ID" = "$EXPECTED_ID"
                test "$VERSION_ID" = "$EXPECTED_VERSION"
                /work/server-setup-base_linux_amd64 manifest --protocol=1 >/tmp/manifest.json
                grep -q "\"name\":\"server-setup-base\"" /tmp/manifest.json
              '
            report="server-setup-readiness-${expected_id}-${expected_version}.json"
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
              --tmpfs /etc/ohtools:rw,nosuid,nodev,size=1m,mode=0755 \
              --tmpfs /etc/profile.d:rw,nosuid,nodev,size=1m,mode=0755 \
              --tmpfs /etc/apt/sources.list.d:rw,nosuid,nodev,size=1m,mode=0755 \
              --volume "$PWD:/work:ro" \
              --volume "$PWD/server-setup-entitlement-fixture-root_linux_amd64:/usr/bin/pro:ro" \
              "$image" sh -ceu '
                . /etc/os-release
                mkdir -p /etc/ohtools/plugins
                printf "%s\n" \
                  "enabled_items: [packages, shell-history]" \
                  "packages: []" \
                  "administrators: []" \
                  "ssh_port: 22" \
                  "manage_firewall: false" \
                  > /etc/ohtools/plugins/server-setup-base.yaml
                if [ "$ID" = debian ] && [ "$VERSION_ID" = 10 ]; then
                  printf "%s\n" \
                    "deb https://deb.freexian.com/extended-lts buster-lts main" \
                    > /etc/apt/sources.list.d/extended-lts.list
                fi
                /work/server-setup-readiness_linux_amd64 binary-smoke /work/server-setup-base_linux_amd64 \
                  >/tmp/binary-smoke.json
                test -s /tmp/binary-smoke.json
                /work/server-setup-readiness_linux_amd64
              ' > "$report"
            ./server-setup-readiness_linux_amd64 verify-report \
              "$report" "$expected_id" "$expected_version"
          done <<'EOF'
          debian:10-slim|debian|10
          debian:11-slim|debian|11
          debian:12-slim|debian|12
          debian:13-slim|debian|13
          ubuntu:20.04|ubuntu|20.04
          ubuntu:22.04|ubuntu|22.04
          ubuntu:24.04|ubuntu|24.04
          EOF

  release:
    needs: server-setup-readiness
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ohtoe02/ohtools-plugin-catalog
          ref: 2cf42710b37fc755b669631f1d27adbd73b6646c
          path: .catalog-contract-source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: Validate registry and vendored protocol contract
        run: |
          go run ./tools/pluginregistry validate
          go run ./tools/contractcheck --canonical .catalog-contract-source/contracts/protocol-v1
      - name: Resolve release coordinates
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          IFS=$'\t' read -r plugin version <<< "$(go run ./tools/pluginregistry resolve-tag "$tag")"
          RELEASE_COMMIT="$(git rev-parse --verify "${GITHUB_REF_NAME}^{commit}")"
          BUILD_DATE="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/${GITHUB_REF_NAME}")"
          test -n "${BUILD_DATE}"
          echo "PLUGIN=$plugin" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
      - name: Test
        run: go test -race ./...
      - name: Build static binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${RELEASE_COMMIT} -X main.buildDate=${BUILD_DATE}" \
            -o "dist/${PLUGIN}_linux_amd64" "./cmd/${PLUGIN}"
          file "dist/${PLUGIN}_linux_amd64" | grep -q "statically linked"
          "dist/${PLUGIN}_linux_amd64" manifest --protocol=1 > "dist/${PLUGIN}_manifest-v1.json"
          go run ./tools/manifestcheck < "dist/${PLUGIN}_manifest-v1.json"
          go run ./tools/pluginregistry check-manifest "${PLUGIN}" "dist/${PLUGIN}_manifest-v1.json"
          sha256sum "dist/${PLUGIN}_linux_amd64" > "dist/${PLUGIN}_linux_amd64.sha256"
      - name: Generate release metadata
        shell: bash
        run: |
          go run ./tools/pluginregistry release-metadata \
            --tag "${GITHUB_REF_NAME}" \
            --binary "dist/${PLUGIN}_linux_amd64" \
            --manifest "dist/${PLUGIN}_manifest-v1.json" \
            --asset-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${PLUGIN}_linux_amd64" \
            --published-at "${BUILD_DATE}" \
            > "dist/${PLUGIN}_release-metadata-v1.json"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.44.0
      - name: Generate SPDX SBOM
        shell: bash
        run: |
          syft "file:dist/${PLUGIN}_linux_amd64" \
            -o "spdx-json=dist/${PLUGIN}_linux_amd64.spdx.raw.json"
          binary_sha="$(sha256sum "dist/${PLUGIN}_linux_amd64" | cut -d ' ' -f 1)"
          go run ./tools/sbomnormalize \
            --created "${BUILD_DATE}" \
            --namespace "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}/sbom/${binary_sha}" \
            < "dist/${PLUGIN}_linux_amd64.spdx.raw.json" \
            > "dist/${PLUGIN}_linux_amd64.spdx.json"
      - name: Resume or publish immutable draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./tools/releasepublish \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${RELEASE_COMMIT}" \
            --asset "dist/${PLUGIN}_linux_amd64" \
            --asset "dist/${PLUGIN}_linux_amd64.sha256" \
            --asset "dist/${PLUGIN}_linux_amd64.spdx.json" \
            --asset "dist/${PLUGIN}_manifest-v1.json" \
            --asset "dist/${PLUGIN}_release-metadata-v1.json"
