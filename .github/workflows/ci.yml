name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.plugins }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ohtoe02/ohtools-plugin-catalog
          ref: 2cf42710b37fc755b669631f1d27adbd73b6646c
          path: .catalog-contract-source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: go run ./tools/pluginregistry validate
      - run: go run ./tools/contractcheck --canonical .catalog-contract-source/contracts/protocol-v1
      - id: matrix
        shell: bash
        run: echo "plugins=$(go run ./tools/pluginregistry matrix)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go test -race -timeout=2m -coverprofile=coverage.out ./...

  static-build:
    needs: registry
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJSON(needs.registry.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: >-
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          go build -trimpath -o "${{ matrix.plugin }}_linux_amd64"
          "./cmd/${{ matrix.plugin }}"
      - run: |
          file "${{ matrix.plugin }}_linux_amd64" | grep -q "statically linked"
      - run: |
          "./${{ matrix.plugin }}_linux_amd64" manifest --protocol=1 > "${{ matrix.plugin }}_manifest-v1.json"
          go run ./tools/manifestcheck < "${{ matrix.plugin }}_manifest-v1.json"
          go run ./tools/pluginregistry check-manifest \
            "${{ matrix.plugin }}" "${{ matrix.plugin }}_manifest-v1.json"

  server-setup-os-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:10-slim
            id: debian
            version: "10"
          - image: debian:11-slim
            id: debian
            version: "11"
          - image: debian:12-slim
            id: debian
            version: "12"
          - image: debian:13-slim
            id: debian
            version: "13"
          - image: ubuntu:20.04
            id: ubuntu
            version: "20.04"
          - image: ubuntu:22.04
            id: ubuntu
            version: "22.04"
          - image: ubuntu:24.04
            id: ubuntu
            version: "24.04"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: Build static server setup binary
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-base_linux_amd64 ./cmd/server-setup-base
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-readiness_linux_amd64 ./tools/server-setup-readiness
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-entitlement-fixture_linux_amd64 \
            ./tools/server-setup-entitlement-fixture
          sudo install -o root -g root -m 0755 \
            server-setup-entitlement-fixture_linux_amd64 \
            server-setup-entitlement-fixture-root_linux_amd64
      - name: Run plugin inside declared OS image
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          EXPECTED_ID: ${{ matrix.id }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --volume "$PWD:/work:ro" \
            --env EXPECTED_ID \
            --env EXPECTED_VERSION \
            "$IMAGE" sh -ceu '
              . /etc/os-release
              test "$ID" = "$EXPECTED_ID"
              test "$VERSION_ID" = "$EXPECTED_VERSION"
              /work/server-setup-base_linux_amd64 manifest --protocol=1 >/tmp/manifest.json
              grep -q "\"name\":\"server-setup-base\"" /tmp/manifest.json
            '
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --tmpfs /etc/ohtools:rw,nosuid,nodev,size=1m,mode=0755 \
            --tmpfs /etc/profile.d:rw,nosuid,nodev,size=1m,mode=0755 \
            --tmpfs /etc/apt/sources.list.d:rw,nosuid,nodev,size=1m,mode=0755 \
            --volume "$PWD:/work:ro" \
            --volume "$PWD/server-setup-entitlement-fixture-root_linux_amd64:/usr/bin/pro:ro" \
            "$IMAGE" sh -ceu '
              . /etc/os-release
              mkdir -p /etc/ohtools/plugins
              printf "%s\n" \
                "enabled_items: [packages, shell-history]" \
                "packages: []" \
                "administrators: []" \
                "ssh_port: 22" \
                "manage_firewall: false" \
                > /etc/ohtools/plugins/server-setup-base.yaml
              if [ "$ID" = debian ] && [ "$VERSION_ID" = 10 ]; then
                printf "%s\n" \
                  "deb https://deb.freexian.com/extended-lts buster-lts main" \
                  > /etc/apt/sources.list.d/extended-lts.list
              fi
              /work/server-setup-readiness_linux_amd64 binary-smoke /work/server-setup-base_linux_amd64 \
                >/tmp/binary-smoke.json
              test -s /tmp/binary-smoke.json
              /work/server-setup-readiness_linux_amd64
            ' > server-setup-readiness-report.json
          ./server-setup-readiness_linux_amd64 verify-report \
            server-setup-readiness-report.json \
            "$EXPECTED_ID" "$EXPECTED_VERSION"

  server-setup-readiness:
    needs: server-setup-os-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: Run server setup readiness suite
        shell: bash
        run: |
          test -f cmd/server-setup-base/main.go
          go test -race -timeout=5m ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-base_linux_amd64 ./cmd/server-setup-base
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-readiness_linux_amd64 ./tools/server-setup-readiness
          file server-setup-base_linux_amd64 | grep -q "statically linked"
          ./server-setup-base_linux_amd64 manifest --protocol=1 \
            > server-setup-base_manifest-v1.json
          go run ./tools/manifestcheck < server-setup-base_manifest-v1.json
          go run ./tools/pluginregistry check-manifest \
            server-setup-base server-setup-base_manifest-v1.json
      - run: go run ./tools/pluginregistry validate
