name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go test -race -timeout=2m -coverprofile=coverage.out ./...

  static-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin:
          - system-base
          - storage-base
          - systemd-base
          - docker-base
          - server-setup-base
          - network-base
          - security-base
          - apt-base
          - baseline-base
          - postgres-base
          - k8s-base
          - java-base
          - kafka-base
          - gitlab-runner-base
          - monitoring-base
          - backup-base
          - incident-base
          - runbook-base
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: >-
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          go build -trimpath -o "${{ matrix.plugin }}_linux_amd64"
          "./cmd/${{ matrix.plugin }}"
      - run: |
          file "${{ matrix.plugin }}_linux_amd64" | grep -q "statically linked"
      - run: |
          "./${{ matrix.plugin }}_linux_amd64" manifest --protocol=1 | go run ./tools/manifestcheck
