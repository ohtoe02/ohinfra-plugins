name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.plugins }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ohtoe02/ohtools-plugin-catalog
          ref: 1cc324c5f62328b6edebebc6360b7d47c593ba19
          path: .catalog-contract-source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: go run ./tools/pluginregistry validate
      - run: go run ./tools/contractcheck --canonical .catalog-contract-source/contracts/protocol-v1
      - id: matrix
        shell: bash
        run: echo "plugins=$(go run ./tools/pluginregistry matrix)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go test -race -timeout=2m -coverprofile=coverage.out ./...

  static-build:
    needs: registry
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJSON(needs.registry.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: >-
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          go build -trimpath -o "${{ matrix.plugin }}_linux_amd64"
          "./cmd/${{ matrix.plugin }}"
      - run: |
          file "${{ matrix.plugin }}_linux_amd64" | grep -q "statically linked"
      - run: |
          "./${{ matrix.plugin }}_linux_amd64" manifest --protocol=1 > "${{ matrix.plugin }}_manifest-v1.json"
          go run ./tools/manifestcheck < "${{ matrix.plugin }}_manifest-v1.json"
          go run ./tools/pluginregistry check-manifest \
            "${{ matrix.plugin }}" "${{ matrix.plugin }}_manifest-v1.json"

  server-setup-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: Validate declared Debian and Ubuntu matrix
        run: >-
          go test -race -timeout=2m ./internal/serversetup
          -run TestResolvePlatformAcceptsOnlyDeclaredMatrix -count=1
      - name: Run server setup readiness suite
        shell: bash
        run: |
          test -f cmd/server-setup-base/main.go
          go test -race -timeout=5m ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o server-setup-base_linux_amd64 ./cmd/server-setup-base
          file server-setup-base_linux_amd64 | grep -q "statically linked"
          ./server-setup-base_linux_amd64 manifest --protocol=1 \
            > server-setup-base_manifest-v1.json
          go run ./tools/manifestcheck < server-setup-base_manifest-v1.json
          go run ./tools/pluginregistry check-manifest \
            server-setup-base server-setup-base_manifest-v1.json
      - run: go run ./tools/pluginregistry validate
